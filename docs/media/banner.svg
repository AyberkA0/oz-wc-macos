<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <title>Oz: a tiling window manager that scrolls vertically</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0;
      --win: #f6f8fa; --bar: #e6eaef; --accent: #9a6700; --accent-win: #fff8c5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --fg: #f0f6fc; --muted: #9198a1; --line: #3d444d;
        --win: #151b23; --bar: #212830; --accent: #d29922; --accent-win: #2a2211;
      }
    }
    .bg { fill: var(--bg); stroke: var(--line); }
    .name { fill: var(--fg); font: 700 120px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -4px; }
    .lead { fill: var(--fg); font: 500 27px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
    .note { fill: var(--muted); font: 400 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
    .win { fill: var(--win); stroke: var(--line); stroke-width: 1.5; }
    .bar { fill: var(--bar); }
    .focus { fill: var(--accent-win); stroke: var(--accent); stroke-width: 2; }
    .ghost { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 5; }
    .screen { fill: none; stroke: var(--fg); stroke-width: 2.5; }
    .track { fill: var(--bar); }
    .thumb { fill: var(--muted); }
  </style>
  <defs>
    <!-- The strip: rows of windows, taller than the screen. -->
    <g id="strip">
      <rect x="790" y="-58" width="308" height="96" rx="7"/>
      <rect x="790" y="46" width="308" height="118" rx="7"/>
      <rect x="790" y="172" width="166" height="96" rx="7"/>
      <rect x="964" y="172" width="134" height="96" rx="7"/>
      <rect x="790" y="276" width="308" height="110" rx="7"/>
      <rect x="790" y="394" width="308" height="80" rx="7"/>
    </g>
    <clipPath id="inside"><rect x="768" y="70" width="352" height="260" rx="12"/></clipPath>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1199" height="399" rx="12"/>

  <text class="name" x="72" y="196">Oz</text>
  <text class="lead" x="76" y="252">A tiling window manager that scrolls vertically.</text>
  <text class="note" x="76" y="292">Windows sit in rows on a strip taller than the screen;</text>
  <text class="note" x="76" y="318">a three-finger swipe moves it up and down.</text>

  <!-- Off screen: the rest of the strip, in outline. -->
  <g clip-path="url(#outside)">
    <use href="#strip" class="ghost"/>
  </g>
  <clipPath id="outside">
    <path d="M760 0 H1200 V400 H760 Z M768 82 V318 A12 12 0 0 0 780 330 H1108 A12 12 0 0 0 1120 318 V82 A12 12 0 0 0 1108 70 H780 A12 12 0 0 0 768 82 Z" clip-rule="evenodd"/>
  </clipPath>

  <!-- On screen: the windows themselves. -->
  <g clip-path="url(#inside)">
    <use href="#strip" class="win"/>
    <rect class="bar" x="791" y="47" width="306" height="14" rx="6"/>
    <rect class="bar" x="791" y="173" width="164" height="14" rx="6"/>
    <rect class="bar" x="791" y="277" width="306" height="14" rx="6"/>
    <rect class="focus" x="964" y="172" width="134" height="96" rx="7"/>
    <rect x="965" y="173" width="132" height="14" rx="6" fill="var(--accent)" opacity="0.25"/>
  </g>

  <rect class="screen" x="768" y="70" width="352" height="260" rx="12"/>

  <!-- Where the screen is on the strip. -->
  <rect class="track" x="1140" y="70" width="4" height="260" rx="2"/>
  <rect class="thumb" x="1140" y="134" width="4" height="122" rx="2"/>
</svg>
