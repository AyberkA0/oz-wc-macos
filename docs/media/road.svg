<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
  <style>
    :root { --line: #d1d9e0; --win: #f6f8fa; --accent: #9a6700; --accent-win: #fff8c5; }
    @media (prefers-color-scheme: dark) {
      :root { --line: #3d444d; --win: #151b23; --accent: #d29922; --accent-win: #2a2211; }
    }
    .rule { stroke: var(--line); stroke-width: 1; }
    .win { fill: var(--win); stroke: var(--line); stroke-width: 1; }
    .focus { fill: var(--accent-win); stroke: var(--accent); stroke-width: 1.2; }
  </style>
  <!-- A line across, with a small strip of three windows in the middle (as in the banner). -->
  <path class="rule" d="M0 12.5 H584 M616 12.5 H1200"/>
  <rect class="win" x="590.5" y="2.5" width="19" height="5" rx="1.5"/>
  <rect class="focus" x="590.5" y="9.5" width="19" height="5" rx="1.5"/>
  <rect class="win" x="590.5" y="16.5" width="19" height="5" rx="1.5"/>
</svg>
